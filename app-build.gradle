plugins {
    id 'com.android.application'
}

android {
    namespace 'com.koc.hatirlatici'
    compileSdk 34

    defaultConfig {
        applicationId "com.koc.hatirlatici"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // Sabit imza anahtarı: sonraki sürümler eskisinin üstüne (verilerini silmeden) kurulabilir.
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
