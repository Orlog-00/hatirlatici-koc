name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Klasor yapisini kur
        run: |
          J=app/src/main/java/com/koc/hatirlatici
          mkdir -p $J app/src/main/res/raw app/src/main/res/drawable
          mv *.java $J/
          mv AndroidManifest.xml app/src/main/
          mv s*.wav app/src/main/res/raw/
          mv ic_*.xml app/src/main/res/drawable/
          mv app-build.gradle app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hatirlatici-koc-apk
          path: app/build/outputs/apk/debug/app-debug.apk
